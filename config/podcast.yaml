# Podcast diario con Google Gemini (plan gratuito). Solo se genera si existe
# el secreto GEMINI_API_KEY en el repositorio.
#
# topics: entre 3 y 5 ids de config/topics.yaml. La app la reescribe desde
#   Ajustes → Podcast, así que déjala EN UNA SOLA LÍNEA. Un cambio aquí no
#   lanza el workflow: se aplica en el podcast del día siguiente.
topics: [optica, pharma, medtech, marketing, ia]

minutes: 10                # duración aproximada del episodio
stories: 9                 # noticias por episodio (al menos una por tema): menos = más desarrolladas
text_chars_per_story: 3000 # texto del artículo que recibe Gemini por noticia
hosts:                     # voces prebuilt de Gemini: Kore, Charon, Puck, Aoede, Achird...
  - name: Lucía
    voice: Kore
  - name: Álex
    voice: Charon
style: "Tono de informativo matinal, cercano y ágil, en español de España."
# Límites del plan gratuito de este proyecto (AI Studio → Límite de frecuencia,
# noviembre de 2026). El cupo diario se reinicia a las 09:00 de Madrid y Google
# cuenta TODAS las peticiones, también las que rechaza por saturación (503).
#   gemini-3.8-flash / 3.6-flash: 5 por minuto, 20 al día
#   gemini-3.5-flash-lite:        15 por minuto, 500 al día
#   gemini-3.8-flash-tts:         3 por minuto, 10 al día  <- el que limita: ~4 por episodio de 10 min
models:                         # en orden: si uno está saturado o sin cupo, el siguiente
  script: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite]
  tts: [gemini-3.8-flash-tts, gemini-3.8-flash-lite-tts]
max_chars_per_request: 3000     # el guion se locuta en trozos de este tamaño (~3 min de audio)
seconds_between_requests: 25    # pausa entre trozos (cupo por minuto del plan gratuito)
busy_rounds: 3                  # si todos los modelos están saturados, rondas de reintento...
busy_wait_seconds: 180          # ...separadas por esta espera
retention_days: 14              # episodios que se conservan en el feed
