# Fuentes de noticias.
# Cada fuente tiene uno o varios feeds RSS. Si TODOS los feeds de una fuente
# fallan, se usa `fallback_gnews`: una búsqueda de Google News limitada a ese
# dominio (también es RSS, así que nunca se queda vacía).
#
# weight: multiplica la puntuación de sus noticias (1.0 = neutro).
# frontpage: true en los feeds de portada da un pequeño plus (lo que el
#            periódico considera importante).
# enabled: false para desactivar sin borrar.
# topics: [id] en medios especializados: todas sus noticias cuentan para ese
#         tema aunque no usen ninguna palabra clave.
# window_hours: ventana propia para medios que publican poco.
# search: en vez de feeds, una búsqueda de Google News (fuente temática);
#         cada noticia muestra el nombre del medio que la publica.
# analysis: true en consultoras de análisis de mercado: sus publicaciones se
#         guardan siempre en la edición y el podcast incluye cada día las que no
#         hayan salido ya en un episodio anterior.

settings:
  window_hours: 30          # solo noticias publicadas en las últimas N horas
  timeout_seconds: 15
  user_agent: "MiDiario/1.0 (+lector personal RSS)"

sources:
  # ---------------- España ----------------
  - id: elpais
    name: El País
    lang: es
    weight: 1.0
    feeds:
      - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada
        frontpage: true
      - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/economia/portada
      - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/tecnologia/portada
