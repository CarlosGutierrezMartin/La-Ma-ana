# Tus temas. Edita este archivo (incluso desde el móvil en github.com)
# y el próximo job ya ordenará las noticias según lo que pongas aquí.
#
# keywords: se buscan en titular (cuenta x3) y entradilla (x1), sin
#   distinguir tildes y siempre como palabra completa.
#   - En minúsculas ("inflación") -> ignora mayúsculas.
#   - Con alguna mayúscula ("Meta", "Fed", "IA") -> respeta mayúsculas,
#     para no confundir la empresa Meta con "la meta" o IA con "ia".
# Un asterisco final hace de prefijo: "chip*" -> chip, chips, chipmaker...
# weight: importancia relativa del tema.
# max_items: cuántas noticias como mucho en la pestaña del tema.

