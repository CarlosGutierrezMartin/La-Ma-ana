# Si una noticia contiene alguna de estas palabras en el titular, se descarta.
exclude:
  - horóscopo
  - fútbol
  - Liga
  - Real Madrid
  - Barça
  - Atlético
  - Champions
  - lotería
  - receta*
  - Gran Hermano

# Resumen con IA (opcional). Solo se usa si existe el secreto
# ANTHROPIC_API_KEY en el repositorio. Sin él, la app funciona igual
# pero sin "Resumen del día" ni resúmenes por noticia.
ai:
  enabled: true
  model: claude-haiku-5-5
  candidates: 40        # cuántas noticias top se le pasan al modelo
  brief_points: 5       # puntos del "Resumen del día"
  effort: low           # low | medium | high: más esfuerzo = más caro y lento
