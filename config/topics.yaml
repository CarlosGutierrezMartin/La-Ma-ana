# Tus temas. Edita este archivo (incluso desde el móvil en github.com)
# y el próximo job ya ordenará las noticias según lo que pongas aquí.
#
# keywords: se buscan en titular (cuenta x3) y entradilla (x1), sin
#   distinguir tildes y siempre como palabra completa.
#   - En minúsculas ("inflación") -> ignora mayúsculas.
#   - Con alguna mayúscula ("Meta", "Fed", "IA") -> respeta mayúsculas,
#     para no confundir la empresa Meta con "la meta" o IA con "ia".
# Un asterisco final hace de prefijo: "chip*" -> chip, chips, chipmaker...
# weight: importancia relativa del tema.
# max_items: cuántas noticias como mucho en la pestaña del tema.

topics:
  - id: ia
    name: Inteligencia artificial
    short: IA
    weight: 1.5
    max_items: 15
    keywords:
      - IA
      - AI
      - inteligencia artificial
      - artificial intelligence
      - OpenAI
      - Anthropic
      - Claude
      - ChatGPT
      - Gemini
      - DeepMind
      - Mistral
      - LLM*
      - modelo de lenguaje
      - language model*
      - agente* de IA
      - AI agent*
      - machine learning
      - aprendizaje automático
      - Nvidia
      - GPU*
      - centro* de datos
      - data center*
      - IA generativa
      - generative AI
      - AI Act
      - reglamento de IA

  - id: tech
    name: Tecnología y big tech
    short: Tech
    weight: 1.2
    max_items: 12
    keywords:
      - tecnológica*
      - Apple
      - Google
      - Alphabet
      - Microsoft
      - Amazon
      - Meta
      - Tesla
      - TSMC
      - semiconductor*
      - chip*
      - ciberseguridad
      - cybersecurity
      - ciberataque*
      - software
      - cloud
      - nube
      - startup*
      - Silicon Valley

  - id: negocios
    name: Empresas y negocios
    short: Negocios
    weight: 1.1
    max_items: 12
    keywords:
      - empresa*
      - compañía*
      - resultados
      - beneficio*
      - facturación
      - fusión
      - adquisición
      - OPA
      - salida a bolsa
      - IPO
      - inversión
      - ronda de financiación
      - funding round
      - valoración
