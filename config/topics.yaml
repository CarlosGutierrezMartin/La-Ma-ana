  - id: economia
    name: Economía y mercados
    short: Economía
    weight: 1.0
    max_items: 10
    keywords:
      - economía
      - Ibex
      - bolsa
      - Wall Street
      - BCE
      - ECB
      - Fed
      - tipos de interés
      - interest rate*
      - inflación
      - inflation
